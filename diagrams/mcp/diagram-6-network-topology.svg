<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" height="100%" style="background:#0c1017;border-radius:12px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="760" height="42" fill="#0f172a" rx="12" />
  <rect x="0" y="30" width="760" height="12" fill="#0f172a" />
  <line x1="0" y1="42" x2="760" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
  <text x="38" y="25" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">ENTERPRISE NETWORK TOPOLOGY &amp; GATEWAY SECURITY</text>
  <text x="720" y="25" fill="#64748b" font-size="11" text-anchor="end">PRODUCTION</text>

  <!-- Node 1: Client Workstation -->
  <rect x="250" y="65" width="260" height="48" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="380" y="95" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Client Workstation</text>

  <!-- Arrow 1: HTTPS -->
  <line x1="380" y1="113" x2="380" y2="155" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="445" y="138" fill="#2dd4bf" font-size="11" font-weight="600">HTTPS (Encrypted)</text>

  <!-- Node 2: Cloudflare / Reverse Proxy -->
  <rect x="230" y="155" width="300" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" />
  <text x="380" y="177" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">Cloudflare / Reverse Proxy</text>
  <text x="380" y="197" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">mcp.company.internal</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="207" x2="380" y2="240" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 3: Internal Load Balancer -->
  <rect x="250" y="240" width="260" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" />
  <text x="380" y="268" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Internal Load Balancer</text>

  <!-- Arrow 3: Split to VPC -->
  <path d="M 380 285 L 380 305 L 230 305 L 230 325" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 380 285 L 380 305 L 530 305 L 530 325" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- VPC Container -->
  <rect x="90" y="315" width="580" height="110" rx="10" fill="#090d16" stroke="#334155" stroke-dasharray="6" />
  <text x="110" y="337" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.5">ENTERPRISE CLOUD INFRASTRUCTURE (VPC)</text>

  <!-- Instance 1 -->
  <rect x="120" y="350" width="220" height="55" rx="8" fill="#1e293b" stroke="#2dd4bf" />
  <text x="230" y="375" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">MCP Container Instance 1</text>
  <text x="230" y="393" fill="#2dd4bf" font-size="10" font-family="monospace" text-anchor="middle">Active / Streamable HTTP</text>

  <!-- Instance 2 -->
  <rect x="420" y="350" width="220" height="55" rx="8" fill="#1e293b" stroke="#2dd4bf" />
  <text x="530" y="375" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">MCP Container Instance 2</text>
  <text x="530" y="393" fill="#2dd4bf" font-size="10" font-family="monospace" text-anchor="middle">Active / Streamable HTTP</text>

  <!-- Merge to DB -->
  <path d="M 230 405 L 230 460 L 380 460" stroke="#2dd4bf" stroke-width="1.5" fill="none" />
  <path d="M 530 405 L 530 460 L 380 460" stroke="#2dd4bf" stroke-width="1.5" fill="none" />
  <line x1="380" y1="460" x2="380" y2="480" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 4: DB (Cylinder Representation) -->
  <rect x="250" y="480" width="260" height="50" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
  <text x="380" y="505" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">🗄️ Internal Enterprise DB</text>
  <text x="380" y="522" fill="#c4b5fd" font-size="10" text-anchor="middle">Strict VPC Firewall &amp; Private Credentials</text>
</svg>
