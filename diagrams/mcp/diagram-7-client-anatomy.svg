<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="100%" height="100%" style="background:#0c1017;border-radius:12px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="780" height="42" fill="#0f172a" rx="12" />
  <rect x="0" y="30" width="780" height="12" fill="#0f172a" />
  <line x1="0" y1="42" x2="780" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
  <text x="38" y="25" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">ANATOMY OF AN MCP HOST: APPLICATION VS CLIENT LAYER</text>
  <text x="740" y="25" fill="#64748b" font-size="11" text-anchor="end">SYSTEM ARCHITECTURE</text>

  <!-- Outer Box: AI Application -->
  <rect x="40" y="65" width="700" height="260" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" stroke-dasharray="6" />
  <rect x="60" y="55" width="220" height="24" rx="4" fill="#1e293b" />
  <text x="70" y="71" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">🧠 AI APPLICATION HOST</text>

  <!-- Inner Top Left: LLM Core -->
  <rect x="70" y="95" width="290" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" />
  <text x="215" y="125" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LLM Reasoning Core</text>
  <text x="215" y="148" fill="#f8fafc" font-size="12" text-anchor="middle">Claude / GPT Inference Engine</text>

  <!-- Inner Top Right: Prompt State -->
  <rect x="420" y="95" width="290" height="75" rx="8" fill="#1e293b" stroke="#818cf8" />
  <text x="565" y="125" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">Prompt &amp; Memory State</text>
  <text x="565" y="148" fill="#f8fafc" font-size="12" text-anchor="middle">Context Window &amp; Conversation Turn</text>

  <!-- Arrows down to Client Layer -->
  <line x1="215" y1="170" x2="215" y2="210" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="565" y1="170" x2="565" y2="210" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Inner Bottom: MCP Client Layer -->
  <rect x="70" y="215" width="640" height="90" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="2" />
  <text x="90" y="240" fill="#99f6e4" font-size="13" font-weight="700">MCP CLIENT LAYER (SUBSYSTEM)</text>
  <text x="90" y="265" fill="#f0fdfa" font-size="12">• Manages subprocess pipes (stdio) and HTTP / SSE sockets</text>
  <text x="90" y="285" fill="#f0fdfa" font-size="12">• Parses, validates JSON-RPC messages and formats tools into LLM schemas</text>

  <!-- Wire Protocol Arrow -->
  <line x1="390" y1="325" x2="390" y2="375" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="300" y="338" width="180" height="22" rx="4" fill="#0f172a" stroke="#2dd4bf" />
  <text x="390" y="353" fill="#2dd4bf" font-size="10" font-weight="700" text-anchor="middle">MCP Wire Protocol</text>

  <!-- Bottom: MCP Server -->
  <rect x="250" y="380" width="280" height="45" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
  <text x="390" y="408" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">MCP Server(s)</text>
</svg>
