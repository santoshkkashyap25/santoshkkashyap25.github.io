<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%" style="background:#0c1017;border-radius:12px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="840" height="42" fill="#0f172a" rx="12" />
  <rect x="0" y="30" width="840" height="12" fill="#0f172a" />
  <line x1="0" y1="42" x2="840" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
  <text x="38" y="25" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">AUTONOMOUS CODE REVIEWER ARCHITECTURE</text>
  <text x="800" y="25" fill="#64748b" font-size="11" text-anchor="end">WORKFLOW</text>

  <!-- Agent -->
  <rect x="40" y="160" width="180" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="130" y="195" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Autonomous</text>
  <text x="130" y="215" fill="#f8fafc" font-size="12" text-anchor="middle">Review Agent</text>

  <!-- Skill Box (Top) -->
  <rect x="290" y="70" width="220" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" />
  <text x="400" y="95" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">Code Review Skill</text>
  <text x="400" y="118" fill="#94a3b8" font-size="11" text-anchor="middle">Audit OWASP, race conditions</text>

  <!-- MCP Client Subsystem (Bottom) -->
  <rect x="290" y="250" width="220" height="65" rx="8" fill="#1e293b" stroke="#2dd4bf" />
  <text x="400" y="275" fill="#2dd4bf" font-size="11" font-weight="700" text-anchor="middle">MCP Client Subsystem</text>
  <text x="400" y="298" fill="#94a3b8" font-size="11" text-anchor="middle">Standard Protocol Transport</text>

  <!-- GitHub MCP Server -->
  <rect x="580" y="250" width="220" height="65" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
  <text x="690" y="275" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">GitHub MCP Server</text>
  <text x="690" y="298" fill="#c4b5fd" font-size="10" font-family="monospace" text-anchor="middle">JSON-RPC Endpoint</text>

  <!-- Tool 1 & Tool 2 (Right) -->
  <rect x="580" y="100" width="220" height="40" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="690" y="125" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">get_pull_request(pr_id)</text>

  <rect x="580" y="160" width="220" height="40" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="690" y="185" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">create_review_comment(...)</text>

  <!-- Connections -->
  <path d="M 220 180 L 290 105" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 210 L 290 280" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <path d="M 510 282 L 580 282" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <path d="M 690 250 L 690 200" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 690 250 L 690 140" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
</svg>
