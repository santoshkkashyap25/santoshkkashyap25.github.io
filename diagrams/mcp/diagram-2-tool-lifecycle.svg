<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#0c1017;border-radius:12px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="920" height="42" fill="#0f172a" rx="12" />
  <rect x="0" y="30" width="920" height="12" fill="#0f172a" />
  <line x1="0" y1="42" x2="920" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
  <text x="38" y="25" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">SEQUENCE DIAGRAM: TOOL INVOCATION LIFECYCLE</text>
  <text x="880" y="25" fill="#64748b" font-size="11" text-anchor="end">MCP FLOW</text>

  <!-- Participants -->
  <!-- User -->
  <rect x="30" y="60" width="120" height="38" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="90" y="84" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">User</text>
  <line x1="90" y1="98" x2="90" y2="500" stroke="#334155" stroke-dasharray="4" />

  <!-- AI Agent -->
  <rect x="200" y="60" width="140" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" />
  <text x="270" y="84" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">AI Agent (LLM)</text>
  <line x1="270" y1="98" x2="270" y2="500" stroke="#334155" stroke-dasharray="4" />

  <!-- MCP Client -->
  <rect x="390" y="60" width="140" height="38" rx="6" fill="#1e293b" stroke="#2dd4bf" />
  <text x="460" y="84" fill="#2dd4bf" font-size="12" font-weight="600" text-anchor="middle">MCP Client</text>
  <line x1="460" y1="98" x2="460" y2="500" stroke="#334155" stroke-dasharray="4" />

  <!-- MCP Server -->
  <rect x="580" y="60" width="140" height="38" rx="6" fill="#1e293b" stroke="#a78bfa" />
  <text x="650" y="84" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">MCP Server</text>
  <line x1="650" y1="98" x2="650" y2="500" stroke="#334155" stroke-dasharray="4" />

  <!-- External API -->
  <rect x="760" y="60" width="130" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" />
  <text x="825" y="84" fill="#f59e0b" font-size="12" font-weight="600" text-anchor="middle">Weather API</text>
  <line x1="825" y1="98" x2="825" y2="500" stroke="#334155" stroke-dasharray="4" />

  <!-- Step 1: User prompt -->
  <line x1="90" y1="125" x2="270" y2="125" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="180" y="118" fill="#f8fafc" font-size="11" text-anchor="middle">1. "What is the weather in Delhi?"</text>

  <!-- Step 2: Discovery tools/list -->
  <line x1="270" y1="165" x2="460" y2="165" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="365" y="158" fill="#94a3b8" font-size="11" text-anchor="middle">2. tools/list</text>

  <line x1="460" y1="185" x2="650" y2="185" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="555" y="178" fill="#94a3b8" font-size="11" text-anchor="middle">3. tools/list</text>

  <!-- Step 3: Returns schema -->
  <line x1="650" y1="215" x2="460" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-dash)" />
  <text x="555" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">4. Available Schemas</text>

  <line x1="460" y1="235" x2="270" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-dash)" />
  <text x="365" y="228" fill="#94a3b8" font-size="11" text-anchor="middle">5. Returns get_weather schema</text>

  <!-- Note: LLM decides -->
  <rect x="200" y="260" width="140" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" />
  <text x="270" y="280" fill="#38bdf8" font-size="10" text-anchor="middle">LLM decides to call tool</text>

  <!-- Step 4: Tool call -->
  <line x1="270" y1="320" x2="460" y2="320" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="365" y="313" fill="#f8fafc" font-size="11" text-anchor="middle">6. tools/call (city='Delhi')</text>

  <line x1="460" y1="350" x2="650" y2="350" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="555" y="343" fill="#f8fafc" font-size="11" text-anchor="middle">7. tools/call request</text>

  <!-- Step 5: External API -->
  <line x1="650" y1="380" x2="825" y2="380" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="737" y="373" fill="#fcd34d" font-size="11" text-anchor="middle">8. Query REST API</text>

  <line x1="825" y1="410" x2="650" y2="410" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-dash)" />
  <text x="737" y="403" fill="#94a3b8" font-size="11" text-anchor="middle">9. 28°C, Clear</text>

  <!-- Step 6: Result payload -->
  <line x1="650" y1="440" x2="460" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-dash)" />
  <text x="555" y="433" fill="#94a3b8" font-size="11" text-anchor="middle">10. Execution result</text>

  <line x1="460" y1="460" x2="270" y2="460" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-dash)" />
  <text x="365" y="453" fill="#94a3b8" font-size="11" text-anchor="middle">11. Structured JSON</text>

  <!-- Step 7: Final response -->
  <line x1="270" y1="485" x2="90" y2="485" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="180" y="478" fill="#2dd4bf" font-size="11" text-anchor="middle">12. "Delhi is 28°C and clear."</text>
</svg>
