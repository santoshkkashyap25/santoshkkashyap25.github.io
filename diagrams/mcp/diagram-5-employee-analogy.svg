<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="100%" style="background:#0c1017;border-radius:12px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="780" height="42" fill="#0f172a" rx="12" />
  <rect x="0" y="30" width="780" height="12" fill="#0f172a" />
  <line x1="0" y1="42" x2="780" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
  <text x="38" y="25" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">THE ORGANIZATIONAL ANALOGY</text>
  <text x="740" y="25" fill="#64748b" font-size="11" text-anchor="end">MENTAL MODEL</text>

  <!-- Node A: AI Agent -->
  <rect x="40" y="125" width="200" height="85" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="140" y="158" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">AI Agent</text>
  <text x="140" y="185" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">"The New Employee"</text>

  <!-- Node B: Skills -->
  <rect x="480" y="70" width="260" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="610" y="100" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">Skills</text>
  <text x="610" y="125" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Employee Handbook &amp; SOPs</text>
  <text x="610" y="142" fill="#94a3b8" font-size="11" text-anchor="middle">(Procedural Knowledge)</text>

  <!-- Node C: MCP Tools -->
  <rect x="480" y="195" width="260" height="80" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" />
  <text x="610" y="225" fill="#2dd4bf" font-size="12" font-weight="700" text-anchor="middle">MCP Tools</text>
  <text x="610" y="250" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Keycard &amp; System Access</text>
  <text x="610" y="267" fill="#94a3b8" font-size="11" text-anchor="middle">(Authorized Capabilities)</text>

  <!-- Arrow Top: Trained By -->
  <path d="M 240 150 C 340 150, 360 110, 480 110" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="305" y="112" width="105" height="22" rx="4" fill="#0f172a" stroke="#2dd4bf" />
  <text x="357" y="127" fill="#2dd4bf" font-size="11" font-weight="700" text-anchor="middle">Trained By</text>

  <!-- Arrow Bottom: Authorized For -->
  <path d="M 240 185 C 340 185, 360 235, 480 235" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <rect x="295" y="202" width="125" height="22" rx="4" fill="#0f172a" stroke="#2dd4bf" />
  <text x="357" y="217" fill="#2dd4bf" font-size="11" font-weight="700" text-anchor="middle">Authorized For</text>
</svg>
